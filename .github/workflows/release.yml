name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Abuya Code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -U pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt "pyinstaller==6.22.3"
          if (-not (Test-Path "outputs\checkpoints\best_model.pth")) { throw "best_model.pth missing" }
          .\.venv\Scripts\python.exe -m PyInstaller --noconfirm --distpath dist --workpath build packaging\BrainTumorViewer.spec
          Compress-Archive -Path dist\BrainTumorViewer\* -DestinationPath dist\BrainTumorViewer-Windows.zip
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: Abuya Code/dist/BrainTumorViewer-Windows.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
